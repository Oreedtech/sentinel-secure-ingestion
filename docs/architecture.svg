<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 630" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Secure Microsoft Sentinel ingestion architecture</title>
<desc>Log sources feed an Event Hubs namespace reachable only over a private endpoint inside an ingestion virtual network. A VNet-integrated function using a managed identity reads events and writes them through a data collection endpoint and DCR into Log Analytics and Sentinel over Azure Monitor Private Link. Entra ID RBAC, an egress firewall, and private DNS zones apply across the design.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect x="42" y="60" width="185" height="50" rx="4" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="134" y="81" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">on-prem syslog</text>
<text x="134" y="98" text-anchor="middle" font-size="12" fill="#5F5E5A">AMA forwarder</text>

<rect x="247" y="60" width="185" height="50" rx="4" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="339" y="81" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">azure diagnostics</text>
<text x="339" y="98" text-anchor="middle" font-size="12" fill="#5F5E5A">diagnostic settings</text>

<rect x="452" y="60" width="185" height="50" rx="4" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="544" y="81" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">saas / api sources</text>
<text x="544" y="98" text-anchor="middle" font-size="12" fill="#5F5E5A">function or logic app</text>

<path d="M134 110 L134 140 L544 140 M544 110 L544 140 M339 110 L339 140" fill="none" stroke="#888780" stroke-width="1.5"/>
<path d="M340 140 L340 183" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="42" y="150" width="595" height="290" rx="4" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="5 4"/>
<text x="56" y="170" font-size="12" fill="#888780">ingestion vnet — private endpoints only</text>

<rect x="150" y="185" width="380" height="56" rx="4" fill="#FAECE7" stroke="#993C1D"/>
<text x="340" y="208" text-anchor="middle" font-size="14" font-weight="500" fill="#4A1B0C">event hubs namespace</text>
<text x="340" y="225" text-anchor="middle" font-size="12" fill="#993C1D">private endpoint, local auth off</text>
<path d="M340 241 L340 273" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="150" y="275" width="380" height="56" rx="4" fill="#FAECE7" stroke="#993C1D"/>
<text x="340" y="298" text-anchor="middle" font-size="14" font-weight="500" fill="#4A1B0C">ingestion function</text>
<text x="340" y="315" text-anchor="middle" font-size="12" fill="#993C1D">vnet integrated, managed identity</text>
<path d="M340 331 L340 363" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="150" y="365" width="380" height="56" rx="4" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="340" y="388" text-anchor="middle" font-size="14" font-weight="500" fill="#04342C">data collection endpoint</text>
<text x="340" y="405" text-anchor="middle" font-size="12" fill="#0F6E56">dcr transform and routing</text>
<path d="M340 421 L340 473" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="352" y="452" font-size="12" fill="#888780">via ampls</text>

<rect x="150" y="475" width="380" height="56" rx="4" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="340" y="498" text-anchor="middle" font-size="14" font-weight="500" fill="#04342C">log analytics + sentinel</text>
<text x="340" y="515" text-anchor="middle" font-size="12" fill="#0F6E56">private link ingestion only</text>

<rect x="42" y="555" width="185" height="54" rx="4" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="134" y="578" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">entra id + rbac</text>
<text x="134" y="595" text-anchor="middle" font-size="12" fill="#5F5E5A">no keys or sas</text>

<rect x="247" y="555" width="185" height="54" rx="4" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="339" y="578" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">egress firewall</text>
<text x="339" y="595" text-anchor="middle" font-size="12" fill="#5F5E5A">udr, fqdn allowlist</text>

<rect x="452" y="555" width="185" height="54" rx="4" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="544" y="578" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">private dns zones</text>
<text x="544" y="595" text-anchor="middle" font-size="12" fill="#5F5E5A">privatelink records</text>
</svg>
